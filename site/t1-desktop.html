<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>slop psychosis — desktop</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="slop.css">
</head><body>
<div id="winlayer"></div>
<div class="menubar"><span class="brand">◆ slop.computer</span><span id="scene-t" class="mid-t"></span><span id="prog"></span><span class="clock" id="clock"></span></div>
<div class="dock" id="dock"></div>
<div class="keyhint">←/→ scenes · SPACE play clip · ESC home · G glossary · Q ask clawd</div>
<script src="engine.js"></script><script src="data.js"></script>
<script>
// deck-as-data: ?deck=trust → deck-trust.js (default: psychosis)
const DECK_NAME = (new URLSearchParams(location.search).get('deck') || 'psychosis').replace(/[^a-z0-9-]/g, '');
document.write(`<script src="deck-${DECK_NAME}.js"><\/script>`);
</script>
<script>
SLOP.paintBg();
document.querySelector('.menubar .brand').textContent = '◆ slop.computer ▸ ' + window.DECK.name;
const S = window.DECK.scenes;
let cur = -1;
const W = () => innerWidth, H = () => innerHeight;

function stage(i) {
  cur = (i + S.length) % S.length;
  SLOP.closeAll();
  const sc = S[cur];
  document.getElementById('scene-t').textContent = sc.kicker;
  document.getElementById('prog').textContent = (cur + 1) + '/' + S.length;
  document.querySelectorAll('#dock .d').forEach((d, j) => d.classList.toggle('on', j === cur));
  location.hash = sc.id;

  let delay = 0;
  const later = (fn, extra=140) => { setTimeout(fn, delay); delay += extra; };

  // title window
  later(() => {
    const big = sc.id === 'title';
    SLOP.mkWindow(sc.kicker, `<div class="tag">${sc.kicker}</div><h1 class="big" style="${big?'':'font-size:clamp(20px,3vw,40px)'}">${sc.title}</h1>
      ${sc.sub ? `<p class="mid muted" style="margin-top:12px">${sc.sub}</p>` : ''}`,
      { x: W()*0.05, y: H()*0.10, w: Math.min(W()*0.52, 760) });
  });

  // list (taxonomy / cure map)
  if (sc.list) later(() => {
    const rows = sc.list.map(([a, b, c]) =>
      `<div style="display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dashed #7c4dff44">
        <span style="font-family:var(--disp);color:var(--slop-${c})">${a}</span>
        <span class="muted">${b}</span></div>`).join('');
    SLOP.mkWindow('taxonomy.md', rows, { x: W()*0.06, y: H()*0.42, w: Math.min(W()*0.42, 560) });
  });

  // quotes
  (sc.quotes || []).forEach((q, j) => later(() => {
    SLOP.mkWindow('quote — ' + q.who.split(',')[0], `<p class="quote">${q.text}<span class="who">— ${q.who}</span></p>`,
      { x: W()*0.06 + j*36, y: H()*0.46 + j*120, w: Math.min(W()*0.40, 520) });
  }));

  // clips stacked on the right
  (sc.clips || []).forEach((k, j) => later(() => {
    SLOP.clipWindow(CLIPS[k], { x: W() - 330 - j*230, y: H()*0.10 + j*56, w: 300 });
  }, 120));

  // points / cure
  if (sc.points) later(() => {
    SLOP.mkWindow('notes', sc.points.map(p => `<p class="mid" style="margin:4px 0">▸ ${p}</p>`).join(''),
      { x: W()*0.08, y: H()*0.72, w: Math.min(W()*0.5, 640) });
  });
  if (sc.cure) later(() => {
    SLOP.mkWindow('💊 the cure', `<p class="mid" style="color:var(--slop-lime)">${sc.cure}</p>`,
      { x: W()*0.30, y: H()*0.74, w: Math.min(W()*0.42, 560) });
  });
  if (sc.qa) later(() => SLOP.qaWindow({ x: W()*0.55, y: H()*0.55 }));
  later(() => SLOP.bindGlossary(), 0);
}

// dock
const dock = document.getElementById('dock');
S.forEach((s, i) => { const d = document.createElement('span'); d.className = 'd'; d.title = s.kicker; d.onclick = () => stage(i); dock.appendChild(d); });

let lastSpace = 0;
function playFocused() {
  // the highlighted (focused) clip window's video — else the topmost video window
  const v = document.querySelector('.win.focus video') ||
    [...document.querySelectorAll('.win video')]
      .sort((a, b) => (+b.closest('.win').style.zIndex || 0) - (+a.closest('.win').style.zIndex || 0))[0];
  if (v) v.paused ? v.play().catch(() => {}) : v.pause();
}
addEventListener('keyup', e => { if (e.key === ' ' && e.target.tagName !== 'INPUT') e.preventDefault(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') {
    // always swallow space (native video controls toggle too); act once per real press
    e.preventDefault();
    if (e.repeat || Date.now() - lastSpace < 350) return;
    lastSpace = Date.now();
    playFocused();
    return;
  }
  if (e.repeat) return;
  if (e.key === 'ArrowRight') { if (cur >= S.length - 1) { location.href = 'index.html'; return; } stage(cur + 1); }
  else if (e.key === 'ArrowLeft') stage(cur - 1);
  else if (e.key === 'Escape') location.href = 'index.html';
  else if (e.key.toLowerCase() === 'q') SLOP.qaWindow({ x: innerWidth/2 - 210, y: innerHeight/2 - 150 });
  else if (e.key.toLowerCase() === 'g') {
    GLOSSARY.slice(0, 6).forEach((g, i) => SLOP.mkWindow('📖 ' + g.term,
      `<p class="quote" style="font-size:14px">${g.tldr}</p>`, { x: 80 + i*90, y: 90 + i*62, w: 330 }));
  }
});
setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString(), 1000);

const start = S.findIndex(s => '#' + s.id === location.hash);
stage(start >= 0 ? start : 0);
</script>
</body></html>
