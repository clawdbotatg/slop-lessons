<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>slop lessons</title>
<link rel="stylesheet" href="slop.css">
</head><body>
<div id="winlayer"></div>
<div class="keyhint">drag the windows · pick a deck</div>
<script src="engine.js"></script><script src="data.js"></script>
<script>
SLOP.paintBg();
SLOP.mkWindow('slop lessons', `
  <div class="tag">slop.computer presents</div>
  <h1 class="big" style="font-size:clamp(22px,3.5vw,44px)">41 EPISODES.<br><span class="hl">3 TALKS.</span></h1>
  <p class="mid muted" style="margin-top:12px">same corpus, different throughlines. pick a deck:</p>`,
  { x: innerWidth*0.06, y: innerHeight*0.08, w: Math.min(innerWidth*0.44, 560) });

const DECKS = [
  ['t1-desktop.html?deck=psychosis', '🧠 slop psychosis', 'the five ways this workflow breaks your brain — every one a real signal, overdone', 'magenta'],
  ['t1-desktop.html?deck=trust', '🔐 code stopped being scarce. trust didn\'t.', 'building is free now; everything still scarce is a form of trust — and that\'s crypto\'s product', 'cyan'],
  ['t1-desktop.html?deck=sloperator', '📖 the sloperator\'s handbook', 'ten craft lessons: context, feedback loops, loop-vs-leash, throw away the code', 'lime'],
];
DECKS.forEach(([href, name, desc, c], i) => SLOP.mkWindow(name, `
  <p class="mid" style="margin:0 0 10px;color:var(--slop-${c})">${desc}</p>
  <a href="${href}"><button class="slop">present ▶</button></a>`,
  { x: innerWidth*0.10 + i*54, y: innerHeight*0.36 + i*118, w: Math.min(innerWidth*0.46, 560) }));

SLOP.mkWindow('other templates', `
  <p class="muted" style="margin:0 0 8px">same psychosis deck, alternate formats:</p>
  <a href="t2-terminal.html"><button class="slop">⌨ terminal</button></a>
  <a href="t3-broadcast.html"><button class="slop">📺 broadcast</button></a>`,
  { x: innerWidth*0.62, y: innerHeight*0.12, w: 330 });

SLOP.mkWindow('🦞 ask clawd', `<p class="muted" style="margin:0">every deck has the Q&A window — press Q while presenting.</p>`,
  { x: innerWidth*0.64, y: innerHeight*0.42, w: 330 });
</script>
</body></html>
